name: Windows

# Builds the one file a Windows user downloads: cadenza-<version>-setup.exe,
# with the Qt runtime, libmpv, TagLib, the MinGW runtime, the locale files and
# the helper tools inside it. Tag a release (v1.0.0) or run it by hand and
# pick the artifact up from the run.
#
# The same thing locally, on a machine with MSYS2:
#
#   powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

on:
  workflow_dispatch:
    inputs:
      no_ffmpeg:
        description: 'Leave ffmpeg out (smaller installer, untagged downloads)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      # For `gh release create` on a tag; artifacts need nothing of their own.
      contents: write

    steps:
      - uses: actions/checkout@v4

      # MSYS2 is the toolchain: Qt6, libmpv and TagLib for MinGW, plus the
      # ntldd that build.ps1 walks the DLL closure with.
      - name: Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc

      - name: Build, gather and package
        shell: pwsh
        run: |
          $arguments = @('-Portable')
          if ('${{ inputs.no_ffmpeg }}' -eq 'true') { $arguments += '-SkipFfmpeg' }
          ./packaging/windows/build.ps1 @arguments

      # The package is only worth shipping if the copy the installer puts on
      # a machine runs: the assertions below install it silently, check the
      # runtime files the app cannot do without, open the index (Qt, the
      # sqlite driver, TagLib, libmpv) and bring the interface up.
      - name: Smoke test the installed copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $setup = Get-ChildItem dist\cadenza-*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'no installer was built' }

          $install = Join-Path $env:RUNNER_TEMP 'cadenza'
          $installer = Start-Process -FilePath $setup.FullName -Wait -PassThru `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$install"
          if ($installer.ExitCode -ne 0) { throw "the installer exited with $($installer.ExitCode)" }

          $exe = Join-Path $install 'cadenza.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'cadenza.exe is not in the installed copy' }

          # tools\ is what the app looks for first, and on Windows the name it
          # looks for carries the .exe. A packaging step that staged `yt-dlp`
          # would leave the music search dead with nothing else to show for it.
          $tools = 'yt-dlp.exe', 'qjs.exe'
          if ('${{ inputs.no_ffmpeg }}' -ne 'true') { $tools += 'ffmpeg.exe' }
          foreach ($tool in $tools) {
              if (-not (Test-Path -LiteralPath (Join-Path $install "tools\$tool"))) {
                  throw "$tool is missing from the installed copy"
              }
          }

          $music = Join-Path $env:RUNNER_TEMP 'music'
          New-Item -ItemType Directory -Force -Path $music | Out-Null

          # The Qt pieces the app cannot work without, in the places
          # windeployqt puts them: the platform plugin Qt loads before
          # anything else, the sqlite driver behind the library index, the
          # JPEG decoder behind every cover, the Windows TLS backend behind
          # the lyrics lookup, and the Basic style the interface asks for.
          foreach ($file in 'platforms\qwindows.dll', 'sqldrivers\qsqlite.dll',
                            'imageformats\qjpeg.dll', 'tls\qschannelbackend.dll',
                            'qml\QtQuick\Controls\Basic\qmldir') {
              if (-not (Test-Path -LiteralPath (Join-Path $install $file))) {
                  throw "$file is missing from the installed copy"
              }
          }

          & $exe --scan $music --database (Join-Path $env:RUNNER_TEMP 'scan.db')
          if ($LASTEXITCODE -ne 0) { throw "cadenza --scan exited with $LASTEXITCODE" }

          # The window itself: a missing QML module makes the engine fail and
          # the process exit, so staying alive for ten seconds is the
          # assertion. The runner has a session, so it is the real platform
          # plugin doing the work -- only qwindows.dll is deployed.
          $app = Start-Process -FilePath $exe -PassThru `
              -ArgumentList $music, '--database', (Join-Path $env:RUNNER_TEMP 'gui.db')
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) { throw "the interface did not come up (exit $($app.ExitCode))" }
          $app.Kill()

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: cadenza-windows
          if-no-files-found: error
          path: |
            dist/cadenza-*-setup.exe
            dist/cadenza-*-win64-portable.zip

      # On a tag the installer is what users download, so it goes on the
      # release itself and not only among the run's artifacts. `gh` is on the
      # runner; GITHUB_TOKEN needs the contents permission set above.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = (Get-ChildItem dist\cadenza-*-setup.exe, dist\cadenza-*-win64-portable.zip).FullName
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
              gh release create $env:GITHUB_REF_NAME @files --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }
