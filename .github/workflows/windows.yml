name: Windows

# Builds the one file a Windows user downloads: cadenza-<version>-setup.exe,
# with the Qt runtime, libmpv, TagLib, the MinGW runtime, the locale files and
# the helper tools inside it.
#
# release.yml calls this for a tag; it also runs by hand from the Actions tab,
# which is how to get the installer without cutting a release.
#
# The same thing locally, on a machine with MSYS2:
#
#   powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

on:
  workflow_call:
    inputs:
      version:
        description: 'Version the binary reports and the files are named after'
        type: string
        default: ''
      no_ffmpeg:
        description: 'Leave ffmpeg out (smaller installer, untagged downloads)'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version the binary reports (default: the one in CMakeLists.txt)'
        default: ''
      no_ffmpeg:
        description: 'Leave ffmpeg out (smaller installer, untagged downloads)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # MSYS2 is the toolchain: Qt6, libmpv and TagLib for MinGW, plus the
      # ntldd that build.ps1 walks the DLL closure with.
      - name: Toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc

      # MSYS2 writes its .pc files the way MSYS2 sees its own tree (`/ucrt64`),
      # and on a runner the toolchain is extracted under a temporary
      # directory: pkg-config answers with a path CMake cannot open, and the
      # build stops at "PkgConfig::MPV includes non-existent path
      # /ucrt64/include". This is the one .pc file the build asks for -- TagLib
      # is found through its CMake package. The paths below are the real ones,
      # written out rather than derived, so nothing has to relocate anything;
      # the version comes from MSYS2's copy of the same file.
      - name: Point pkg-config at the toolchain
        shell: pwsh
        run: |
          $msys2 = '${{ steps.msys2.outputs.msys2-location }}'
          $prefix = ($msys2 -replace '\\', '/') + '/ucrt64'

          $upstream = Join-Path $msys2 'ucrt64\lib\pkgconfig\mpv.pc'
          $match = Select-String -LiteralPath $upstream -Pattern '^Version:\s*(.+)$'
          if (-not $match) { throw "no version in $upstream" }
          $version = $match.Matches[0].Groups[1].Value.Trim()

          $pcdir = Join-Path $env:RUNNER_TEMP 'pkgconfig'
          New-Item -ItemType Directory -Force -Path $pcdir | Out-Null

          @"
          libdir=$prefix/lib
          includedir=$prefix/include

          Name: mpv
          Description: mpv media player client library
          Version: $version
          Libs: -L`${libdir} -lmpv
          Cflags: -I`${includedir}
          "@ | Set-Content -Encoding ascii -NoNewline (Join-Path $pcdir 'mpv.pc')

          "PKG_CONFIG_PATH=$pcdir" >> $env:GITHUB_ENV
          Write-Host "    mpv $version, from $pcdir"

      - name: Build, gather and package
        shell: pwsh
        run: |
          # Where the action put MSYS2, rather than the C:\msys64 build.ps1
          # assumes: a runner that has to download and extract the base
          # installation does not necessarily land on that path.
          $msys2 = '${{ steps.msys2.outputs.msys2-location }}'

          # The version this release publishes. Empty on a hand run, and then
          # the script falls back to the one in CMakeLists.txt -- which is
          # also the version the checks below expect to see reported.
          $version = '${{ inputs.version }}'
          if (-not $version) {
              $source = Get-Content -LiteralPath 'CMakeLists.txt' -Raw
              if ($source -notmatch 'project\(\s*cadenza\s+VERSION\s+([0-9][0-9.]*)') {
                  throw 'no version in CMakeLists.txt'
              }
              $version = $Matches[1]
          }
          "CADENZA_VERSION=$version" >> $env:GITHUB_ENV

          # A hashtable and not an array: splatting '-Portable' as an array
          # element hands it to the script as a positional value, which is how
          # it ended up in -Msys2 and the build went looking for
          # '-Portable\ucrt64\bin\cmake.exe'.
          $arguments = @{ Portable = $true; Version = $version }
          if ('${{ inputs.no_ffmpeg }}' -eq 'true') { $arguments.SkipFfmpeg = $true }

          if ($msys2) { ./packaging/windows/build.ps1 -Msys2 $msys2 @arguments }
          else { ./packaging/windows/build.ps1 @arguments }

      # The package is only worth shipping if what it puts on a machine runs:
      # the checks below open the index (Qt, the sqlite driver, TagLib,
      # libmpv), install the package silently, and bring the interface up out
      # of the installed copy. Nothing here waits without a deadline and every
      # step says where it is, because a runner that sits for forty minutes
      # with a silent log says nothing about why.
      - name: Smoke test the installed copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $out = Join-Path $env:RUNNER_TEMP 'cadenza.out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'cadenza.err.txt'

          function Invoke-Cadenza {
              param([string]$Exe, [string[]]$Arguments, [int]$Seconds = 180)
              Write-Host "==> $([IO.Path]::GetFileName($Exe)) $($Arguments -join ' ')"
              $process = Start-Process -FilePath $Exe -PassThru -ArgumentList $Arguments `
                  -RedirectStandardOutput $out -RedirectStandardError $err
              if (-not $process.WaitForExit($Seconds * 1000)) {
                  $process.Kill()
                  Get-Content -LiteralPath $err -ErrorAction SilentlyContinue | Write-Host
                  throw "$($Arguments[0]) did not finish within ${Seconds}s"
              }
              Get-Content -LiteralPath $err -ErrorAction SilentlyContinue | Write-Host
              if ($process.ExitCode -ne 0) {
                  throw "$($Arguments[0]) exited with $($process.ExitCode)"
              }
          }

          $music = Join-Path $env:RUNNER_TEMP 'music'
          New-Item -ItemType Directory -Force -Path $music | Out-Null

          # A GUI executable has no console, and Qt writes its warnings to the
          # debugger when it thinks there is none; this makes it write to the
          # files above instead, which is the difference between "it did not
          # work" and knowing why.
          $env:QT_ASSUME_STDERR_HAS_CONSOLE = '1'

          # TEMPORARY: why the engine cannot find QtQuick.Controls' plugin.
          $env:QML_IMPORT_TRACE = '1'
          $env:QT_DEBUG_PLUGINS = '1'

          # The window, out of whichever tree is given: staying up for ten
          # seconds is the assertion, because a missing QML module or a plugin
          # the engine cannot load makes it fail and the process exit. What it
          # said before exiting, and what is actually in the module's
          # directory, is printed when it does not stay up.
          function Test-Interface {
              param([string]$Exe, [string]$Database)
              $tree = Split-Path -Parent $Exe
              Write-Host "==> opening the interface out of $tree"
              $app = Start-Process -FilePath $Exe -PassThru `
                  -RedirectStandardOutput $out -RedirectStandardError $err `
                  -ArgumentList $music, '--database', $Database
              Start-Sleep -Seconds 10
              $app.Refresh()
              if (-not $app.HasExited) {
                  Write-Host '    still up after ten seconds'
                  $app.Kill()
                  return
              }
              Get-Content -LiteralPath $err -Tail 40 -ErrorAction SilentlyContinue | Write-Host
              Write-Host '    qml\QtQuick\Controls:'
              Get-ChildItem -LiteralPath (Join-Path $tree 'qml\QtQuick\Controls') -ErrorAction SilentlyContinue |
                  ForEach-Object { Write-Host "        $($_.Name)" }
              Write-Host "    qt.conf beside the executable: $(Test-Path -LiteralPath (Join-Path $tree 'qt.conf'))"
              throw "the interface did not come up out of $tree (exit $($app.ExitCode))"
          }

          # The payload first, out of the build tree, because it is the one
          # thing the installer does not change: this is where opening the
          # library index is checked, and it is why the DLL closure is walked
          # over the whole tree -- the sqlite driver needs libsqlite3-0.dll,
          # and nothing else in the package references it.
          $payload = Join-Path (Resolve-Path 'dist\bin').Path 'cadenza.exe'
          Invoke-Cadenza -Exe $payload -Arguments @('--version')
          # The stamp, checked: a build that reported the version in
          # CMakeLists.txt instead of the one this release publishes is one
          # that says it is older than it is, to anyone reading `--version`.
          $reported = (Get-Content -LiteralPath $out -Raw -ErrorAction SilentlyContinue)
          Write-Host "    reports: $($reported.Trim())"
          if ($reported -notmatch [regex]::Escape($env:CADENZA_VERSION)) {
              throw "the build reports '$($reported.Trim())', not $env:CADENZA_VERSION"
          }
          Invoke-Cadenza -Exe $payload -Arguments @('--scan', $music,
              '--database', (Join-Path $env:RUNNER_TEMP 'payload.db'))
          Test-Interface -Exe $payload -Database (Join-Path $env:RUNNER_TEMP 'payload-gui.db')

          $setup = Get-ChildItem dist\cadenza-*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'no installer was built' }

          Write-Host "==> installing $($setup.Name)"
          $install = Join-Path $env:RUNNER_TEMP 'cadenza'
          $installer = Start-Process -FilePath $setup.FullName -PassThru `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$install"
          if (-not $installer.WaitForExit(600 * 1000)) {
              $installer.Kill()
              throw 'the installer did not finish within ten minutes'
          }
          if ($installer.ExitCode -ne 0) { throw "the installer exited with $($installer.ExitCode)" }

          $exe = Join-Path $install 'cadenza.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'cadenza.exe is not in the installed copy' }

          # tools\ is what the app looks for first, and on Windows the name it
          # looks for carries the .exe. A packaging step that staged `yt-dlp`
          # would leave the music search dead with nothing else to show for it.
          $tools = 'yt-dlp.exe', 'qjs.exe'
          if ('${{ inputs.no_ffmpeg }}' -ne 'true') { $tools += 'ffmpeg.exe' }
          foreach ($tool in $tools) {
              if (-not (Test-Path -LiteralPath (Join-Path $install "tools\$tool"))) {
                  throw "$tool is missing from the installed copy"
              }
          }

          # The Qt pieces the app cannot work without, in the places
          # windeployqt puts them: the platform plugin Qt loads before
          # anything else, the sqlite driver behind the library index, the
          # JPEG decoder behind every cover, the Windows TLS backend behind
          # the lyrics lookup, and the QML module behind every control the
          # interface draws -- the .qml files and the plugin next to them,
          # which is what the engine loads by name.
          foreach ($file in 'platforms\qwindows.dll', 'sqldrivers\qsqlite.dll',
                            'imageformats\qjpeg.dll', 'tls\qschannelbackend.dll',
                            'qml\QtQuick\Controls\qtquickcontrols2plugin.dll',
                            'qml\QtQuick\Controls\Basic\qmldir') {
              if (-not (Test-Path -LiteralPath (Join-Path $install $file))) {
                  throw "$file is missing from the installed copy"
              }
          }

          # The same window, out of the installed copy: the installer's own
          # question. The runner has a session, so it is the real platform
          # plugin doing the work -- only qwindows.dll is deployed.
          Test-Interface -Exe $exe -Database (Join-Path $env:RUNNER_TEMP 'gui.db')

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            dist/cadenza-*-setup.exe
            dist/cadenza-*-win64-portable.zip
