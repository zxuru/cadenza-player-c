name: Release

# Every push to main publishes a release, so the newest release is always the
# code that was pushed last; a tag publishes the version it carries. The
# version is stamped into both builds, which is what lets a copy say which
# release it came from.
#
#   push to main   v<major>.<minor>.<run number>   the patch is the run number,
#                                                  which only ever grows
#   tag v1.2.3     v1.2.3                          the version in the tag
#
# The build itself lives in the two platform workflows, which also run by hand
# from the Actions tab when only the artifact is wanted. Run by hand, this one
# builds and checks and publishes nothing.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # A commit that rewrites prose does not need two runners. Tags are exempt
    # from path filters, so a release still builds everything.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.number.outputs.version }}
      tag: ${{ steps.number.outputs.tag }}
      publish: ${{ steps.number.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      # The patch is the run number, which only grows: no two builds of the
      # same base version are ordered randomly, which is what telling a newer
      # release from an older one needs.
      - id: number
        name: Work out the version this run publishes
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              version="${GITHUB_REF_NAME#v}"
          else
              base="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' \
                  CMakeLists.txt | head -1)"
              if [[ -z "${base}" ]]; then
                  echo 'error: no version in the project() call of CMakeLists.txt' >&2
                  exit 1
              fi
              version="${base%.*}.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "error: '${version}' is not a version of the form 1.2.3" >&2
              exit 1
          fi

          publish=false
          if [[ "${GITHUB_REF}" == refs/tags/v* || "${GITHUB_REF}" == refs/heads/main ]]; then
              publish=true
          fi

          {
              echo "version=${version}"
              echo "tag=v${version}"
              echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

          echo "    version ${version}" >&2
          echo "    publishing ${publish}" >&2
          echo "This run publishes v${version}, testing $( [[ "${publish}" == true ]] && echo 'and publishing' || echo 'only' )" \
              >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: version
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ needs.version.outputs.version }}

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Runs on a publishable commit and on a hand run alike: what would be
  # published is collected and hashed either way, and only the release itself
  # is held back when this run is not publishing.
  release:
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      # For `gh release create`; nothing else in this workflow writes.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Every file that lands on a release is named here, and nothing else is
      # allowed through: an artifact that shows up unannounced means a build
      # step wrote somewhere it should not have.
      - name: Collect the assets
        run: |
          set -euo pipefail

          expected=(
              "cadenza-${VERSION}-setup.exe"
              "cadenza-${VERSION}-win64-portable.zip"
              "cadenza-${VERSION}-x86_64.AppImage"
          )

          for name in "${expected[@]}"; do
              if [[ ! -f "dist/${name}" ]]; then
                  echo "error: ${name} was not built:" >&2
                  ls -l dist >&2
                  exit 1
              fi
          done

          for path in dist/*; do
              name="$(basename "${path}")"
              if [[ ! " ${expected[*]} " == *" ${name} "* ]]; then
                  echo "error: dist/${name} is an artifact nothing publishes" >&2
                  exit 1
              fi
          done

          ( cd dist && sha256sum "${expected[@]}" > SHA256SUMS )
          cat dist/SHA256SUMS

          echo "EXPECTED_ASSETS=${expected[*]}" >> "$GITHUB_ENV"

      - name: Publish
        if: needs.version.outputs.publish == 'true'
        run: |
          set -euo pipefail

          version="${VERSION}"
          # Prepended to the generated notes: the release page is where a user
          # finds out which of the three files is theirs.
          cat > notes.md <<EOF
          One file per platform; \`SHA256SUMS\` covers all three.

          | File | What it is |
          |---|---|
          | \`cadenza-${version}-setup.exe\` | Windows: everything inside, double-click to install |
          | \`cadenza-${version}-win64-portable.zip\` | Windows: unzip and run, no installer |
          | \`cadenza-${version}-x86_64.AppImage\` | Linux: \`chmod +x\` and run, nothing to install |

          The AppImage is built on Ubuntu 24.04 and carries Qt, libmpv, TagLib
          and the helper tools; it wants glibc 2.39 or newer, which is
          Ubuntu 24.04 and anything released after it. macOS is not built here
          -- see [packaging/macos](https://github.com/${GH_REPO}/blob/main/packaging/macos/README.md).
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
              # A rerun of the same version: the release is already there, and
              # what it carries is what this run just built.
              gh release upload "${TAG}" --clobber dist/cadenza-* dist/SHA256SUMS
              exit 0
          fi

          # On a push the tag does not exist yet: the release creates it, at
          # the commit this run built. A tag push brought its own.
          target=()
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
              target=(--target "${GITHUB_SHA}")
          fi

          gh release create "${TAG}" \
              --title "Cadenza v${version}" \
              --generate-notes \
              --notes-file notes.md \
              --latest \
              "${target[@]}" \
              dist/cadenza-* dist/SHA256SUMS

      # What was published, read back: an upload that quietly dropped a file
      # is the kind of failure a release page shows the world.
      - name: Check what the release carries
        if: needs.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # EXPECTED_ASSETS is a space-separated list
          want="$(printf '%s\n' ${EXPECTED_ASSETS} SHA256SUMS | sort | xargs)"
          got="$(gh release view "${TAG}" --json assets \
              --jq '[.assets[].name] | sort | join(" ")')"
          if [[ "${got}" != "${want}" ]]; then
              echo "error: the release carries '${got}', expected '${want}'" >&2
              exit 1
          fi
          echo "    ${got}"
          echo "    https://github.com/${GH_REPO}/releases/tag/${TAG}"
