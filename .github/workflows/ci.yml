name: CI

# Pull requests only: a push to main is what release.yml is for, and it builds
# both platforms and tests them there. This is the same Linux job without
# ffmpeg, which is the fast half of that, so a branch knows it is broken
# before it is merged.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    uses: ./.github/workflows/linux.yml
    with:
      no_ffmpeg: true
