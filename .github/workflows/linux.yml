name: Linux

# Builds the file Linux users download: one AppImage with the Qt runtime,
# libmpv, TagLib and the helper tools inside it, smoke-tested by unpacking it
# and running it with no Qt on PATH.
#
# release.yml calls this for a tag; it also runs by hand from the Actions tab,
# which is how to get the artifact without cutting a release.
#
# The same thing locally:
#
#   packaging/tools/fetch-tools.sh --ffmpeg
#   packaging/linux/build-appimage.sh          # linuxdeploy + its Qt plugin on PATH

on:
  workflow_call:
    inputs:
      version:
        description: 'Version the AppImage filename carries (default: CMakeLists.txt)'
        type: string
        default: ''
      no_ffmpeg:
        description: 'Leave ffmpeg out (smaller AppImage, untagged downloads)'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version the AppImage filename carries (default: the one in CMakeLists.txt)'
        default: ''
      no_ffmpeg:
        description: 'Leave ffmpeg out (smaller AppImage, untagged downloads)'
        type: boolean
        default: false

env:
  # Qt 6.5 is the floor CMakeLists.txt states and no Ubuntu package meets it,
  # so Qt comes from the Qt project's own binaries. Pinned, because the
  # package is built against it: a moving version would make two runs of the
  # same commit produce different files.
  QT_VERSION: 6.10.3

permissions:
  contents: read

jobs:
  appimage:
    # 24.04 and not 22.04: the README's floors are libmpv 0.37 and TagLib 1.13
    # and 22.04 ships neither (0.34 and 1.12), so an AppImage built there
    # would bundle libraries the project does not support. Pinned rather than
    # `ubuntu-latest`, because the runner's glibc becomes the floor the
    # shipped file demands of the machine it lands on.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # aqtinstall fetches the same release the online installer serves:
      # qtbase, qtdeclarative and qtsvg, which is the whole list.
      - name: Qt ${{ env.QT_VERSION }}
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet aqtinstall
          "${HOME}/.local/bin/aqt" install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
              --outputdir "${HOME}/Qt" | tail -3

          qt_root="${HOME}/Qt/${QT_VERSION}/gcc_64"
          echo "${qt_root}/bin" >> "$GITHUB_PATH"

          # A second view of the same tree, and the one the packaging step is
          # pointed at. linuxdeploy-plugin-qt deploys every plugin of the
          # modules the application uses, and among the SQL drivers it then
          # deploys, only sqlite's has dependencies that exist: mimer's client
          # library is proprietary and the others are not installed, so the
          # walk stops at the first one it cannot resolve. The NetworkManager
          # plugin goes for the same reason -- it links libnm. Hard links, so
          # this costs no disk and no time, and the real Qt stays untouched:
          # the build needs it whole, since Qt6Sql's CMake package validates
          # the very plugin files this view leaves out.
          qt_view="${HOME}/qt-for-packaging"
          rm -rf "${qt_view}"
          cp -al "${qt_root}" "${qt_view}"

          for driver in "${qt_view}"/plugins/sqldrivers/*.so; do
              [[ "$(basename "${driver}")" != 'libqsqlite.so' ]] && rm -f "${driver}"
          done
          rm -f "${qt_view}"/plugins/networkinformation/*.so

          # qmake is asked where Qt is from this view, not from wherever the
          # binary's own prefix points.
          printf '[Paths]\nPrefix=..\n' > "${qt_view}/bin/qt.conf"

          {
              echo "QT_ROOT_DIR=${qt_root}"
              echo "CMAKE_PREFIX_PATH=${qt_root}"
              # linuxdeploy resolves the executable's dependencies with the
              # loader, and Qt lives in a prefix the loader does not know:
              # without this it fails on the first Qt library it meets.
              echo "LD_LIBRARY_PATH=${qt_root}/lib"
              # build-appimage.sh hands this to linuxdeploy-plugin-qt, which
              # asks qmake where Qt is instead of guessing.
              echo "QMAKE=${qt_view}/bin/qmake6"
          } >> "$GITHUB_ENV"

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
              build-essential cmake pkg-config \
              libmpv-dev libtag1-dev \
              libgl1-mesa-dev libegl1-mesa-dev \
              file xz-utils libfuse2

          # linuxdeploy resolves the dependency closure of every plugin it
          # deploys, the xcb and wayland platform plugins included, and fails
          # on the first library it cannot find even though the package
          # carries its own copy of it. libgtk-3 is what the gtk3 platform
          # theme -- the native folder dialog the interface opens -- links
          # against.
          sudo apt-get install --yes --no-install-recommends \
              libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0t64 libgtk-3-0t64 \
              libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 \
              libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
              libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 \
              libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
              libsm6 libice6 libxi6 libxtst6 libxcursor1 libxrandr2 \
              libxrender1 libxfixes3 libxv1 \
              libwayland-client0 libwayland-cursor0 libwayland-egl1 libdecor-0-0

      # What the package is allowed to be built against, checked rather than
      # assumed: the AppImage carries the libmpv and TagLib of the machine
      # that built it, so an older one would ship libraries the project does
      # not support.
      - name: Library floors
        run: |
          set -euo pipefail
          require() {
              local package="$1" minimum="$2" found
              found="$(pkg-config --modversion "${package}")"
              if [[ "$(printf '%s\n%s\n' "${minimum}" "${found}" | sort -V | head -1)" != "${minimum}" ]]; then
                  echo "error: ${package} ${found} is older than the ${minimum} the README requires" >&2
                  exit 1
              fi
              echo "    ${package} ${found}"
          }
          qt="$(qmake6 -query QT_VERSION)"
          [[ "$(printf '%s\n%s\n' 6.5 "${qt}" | sort -V | head -1)" == "6.5" ]] || {
              echo "error: Qt ${qt} is older than the 6.5 the README requires" >&2
              exit 1
          }
          echo "    Qt ${qt}"
          require mpv 0.37
          require taglib 1.13

      - name: Stage the helper tools
        run: |
          if [[ "${{ inputs.no_ffmpeg }}" == 'true' ]]; then
              packaging/tools/fetch-tools.sh
          else
              packaging/tools/fetch-tools.sh --ffmpeg
          fi

      # linuxdeploy and its Qt plugin are AppImages themselves, and the
      # mounts they normally use are not always available on a runner, which
      # is what APPIMAGE_EXTRACT_AND_RUN is for.
      - name: linuxdeploy
        run: |
          set -euo pipefail
          install -d "${HOME}/.local/bin"
          for tool in linuxdeploy linuxdeploy-plugin-qt; do
              curl --fail --location --silent --show-error \
                  --output "${HOME}/.local/bin/${tool}" \
                  "https://github.com/linuxdeploy/${tool}/releases/download/continuous/${tool}-x86_64.AppImage"
              chmod +x "${HOME}/.local/bin/${tool}"
          done
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Build the AppImage
        env:
          LINUXDEPLOY_OUTPUT_VERSION: ${{ inputs.version }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          # linuxdeploy-plugin-qt deploys libqxcb.so on its own, and this is
          # the one it has to be asked for by name: `cadenza --scan` opens a
          # QGuiApplication like everything else, and a machine with no
          # display has no xcb to fall back on.
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
          # The application's QML is compiled into the binary, so the plugin
          # has nothing to scan unless it is told where the sources are: what
          # it looks for is the modules they import.
          QML_SOURCES_PATHS: ${{ github.workspace }}/src/ui
        run: |
          set -euo pipefail
          packaging/linux/build-appimage.sh
          ls -l dist

      # The artifact is what ships, so the artifact is what is tested. The
      # file is unpacked first: the runner has Qt and libmpv installed, so a
      # run that reached for those instead of the copies inside the AppImage
      # would pass while the AppImage itself was broken.
      - name: Smoke test the AppImage
        run: |
          set -euo pipefail

          appimage="$(ls dist/*.AppImage)"
          name="$(basename "${appimage}")"
          version="$(sed -E 's/^cadenza-(.+)-x86_64\.AppImage$/\1/' <<< "${name}")"
          if [[ "${version}" == "${name}" ]]; then
              echo "error: ${name} is not named cadenza-<version>-x86_64.AppImage" >&2
              exit 1
          fi

          work="$(mktemp -d)"
          mkdir -p "${work}/music"

          APPIMAGE_EXTRACT_AND_RUN=1 ./"${appimage}" --appimage-extract >/dev/null

          # What the file promises: the runtime it carries, the plugins that
          # make it work (the sqlite driver behind the index, the Qt Quick
          # Controls Basic style the interface asks for, a platform plugin)
          # and the tools the music search shells out to.
          for library in libQt6Core libQt6Quick libQt6Sql libmpv libtag; do
              find squashfs-root -name "${library}*.so*" | grep -q . || {
                  echo "error: ${library} is not inside the AppImage" >&2
                  exit 1
              }
          done
          for plugin in libqsqlite.so libqxcb.so libqoffscreen.so QtQuick/Controls/Basic/qmldir; do
              find squashfs-root -path "*${plugin}" | grep -q . || {
                  echo "error: ${plugin} is not inside the AppImage" >&2
                  exit 1
              }
          done

          tools=(yt-dlp qjs)
          if [[ "${{ inputs.no_ffmpeg }}" != 'true' ]]; then
              tools+=(ffmpeg)
          fi
          for tool in "${tools[@]}"; do
              test -x "squashfs-root/usr/bin/tools/${tool}" || {
                  echo "error: ${tool} is not staged inside the AppImage" >&2
                  exit 1
              }
          done

          # A scrubbed environment: no Qt on PATH, no import paths exported,
          # HOME pointed at a scratch directory. Whatever the application
          # needs it has to find inside the file.
          app=(env -i HOME="${work}" PATH=/usr/bin:/bin LANG=C.UTF-8
               APPIMAGE_EXTRACT_AND_RUN=1
               QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software
               ./"${appimage}")

          status=0
          reported="$(timeout --signal=TERM 60 "${app[@]}" --version)" || status=$?
          [[ "${status}" -eq 0 ]] || { echo "error: --version exited with ${status}" >&2; exit 1; }
          echo "    ${reported}"
          [[ "${reported}" == *"${version}"* ]] || {
              echo "error: the AppImage is named ${version} but reports '${reported}'" >&2
              exit 1
          }

          status=0
          timeout --signal=TERM 60 "${app[@]}" --check-i18n || status=$?
          [[ "${status}" -eq 0 ]] || { echo "error: --check-i18n exited with ${status}" >&2; exit 1; }

          status=0
          timeout --signal=TERM 60 "${app[@]}" --scan "${work}/music" --database "${work}/scan.db" || status=$?
          [[ "${status}" -eq 0 ]] || { echo "error: --scan exited with ${status}" >&2; exit 1; }

          # The window: a missing QML module or a plugin the engine cannot
          # load makes it fail and the process exit, so being alive after
          # twenty seconds is the assertion -- and its own output is what says
          # which module it was, when it is not.
          status=0
          timeout --signal=TERM 20 "${app[@]}" "${work}/music" --database "${work}/gui.db" \
              >"${work}/gui.log" 2>&1 || status=$?
          if [[ "${status}" -ne 124 ]]; then
              sed 's/^/    /' "${work}/gui.log" >&2 || true
              echo "error: the interface did not come up (exit ${status})" >&2
              exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          if-no-files-found: error
          path: dist/*.AppImage
